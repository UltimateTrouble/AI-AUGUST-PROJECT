<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWS Explorer: CA Edition</title>
    
    <!-- Load Tailwind CSS & Configure Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    
    <!-- Load Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Load Leaflet for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(1rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fix Leaflet map z-index issues with custom UI */
        .leaflet-control-container .leaflet-top { z-index: 400 !important; }
        .leaflet-control-container .leaflet-bottom { z-index: 400 !important; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 font-sans p-4 md:p-8 min-h-screen transition-colors duration-300">
    
    <!-- Main Application Container -->
    <div id="app" class="max-w-5xl mx-auto space-y-8"></div>

    <script>
        let state = {
            zipCode: '90401',
            locationName: '',
            forecast: null,
            currentWeather: null,
            cpcOutlooks: null,
            alerts: [],
            recentSearches: JSON.parse(localStorage.getItem('nws_recent_searches') || '[]'),
            isDark: localStorage.getItem('nws_dark') === 'true',
            unit: localStorage.getItem('nws_unit') || 'F', // 'F' or 'C'
            loading: false,
            error: '',
            activeTab: 'daily',
            selectedClimateMonth: 0,
            mainTab: 'forecast',
            showMap: false,
            // Radar State
            radarFrames: [],
            currentRadarIndex: 0,
            radarPlaying: false,
            radarHost: 'https://tilecache.rainviewer.com'
        };

        // Apply Dark Mode on Load
        if (state.isDark) document.documentElement.classList.add('dark');

        // Helpers
        const saveRecentSearch = (zip, name) => {
            let searches = state.recentSearches.filter(s => s.zip !== zip);
            searches.unshift({ zip, name });
            searches = searches.slice(0, 4);
            state.recentSearches = searches;
            localStorage.setItem('nws_recent_searches', JSON.stringify(searches));
        };

        // Temperature conversion helper
        window.getTemp = (tempF) => {
            if (!tempF && tempF !== 0) return '--';
            if (state.unit === 'C') {
                return Math.round((tempF - 32) * 5/9);
            }
            return tempF;
        };

        window.parseCPCData = (tempData, precipData) => {
            const outlooks = [];
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const fullMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            const extractOutlook = (result) => {
                if (!result || !result.attributes) return { cat: 'Equal Chances', prob: null, description: 'Equal chances of above, near, or below normal conditions.' };
                const attrs = result.attributes;
                const cat = attrs.Cat || attrs.CAT || attrs.cat || attrs.Category || 'EC';
                const probRaw = attrs.Prob || attrs.PROB || attrs.prob || attrs.Probability;
                const prob = probRaw ? parseFloat(probRaw).toFixed(0) : null;
                let formattedCat = 'Equal Chances';
                let desc = 'Equal chances of above, near, or below normal conditions.';
                if (cat.toUpperCase().startsWith('A')) {
                    formattedCat = 'Above Normal';
                    desc = `Leans toward above normal conditions (${prob}% probability).`;
                } else if (cat.toUpperCase().startsWith('B')) {
                    formattedCat = 'Below Normal';
                    desc = `Leans toward below normal conditions (${prob}% probability).`;
                } else if (cat.toUpperCase().startsWith('N')) {
                    formattedCat = 'Near Normal';
                    desc = `Leans toward near normal conditions (${prob}% probability).`;
                }
                return { cat: formattedCat, prob, description: desc };
            };

            for (let i = 0; i < 13; i++) {
                const tResult = tempData?.results?.find(r => r.layerId === i);
                const pResult = precipData?.results?.find(r => r.layerId === i);
                const m1Idx = (currentMonth + 1 + i) % 12;
                const m2Idx = (currentMonth + 2 + i) % 12;
                const m3Idx = (currentMonth + 3 + i) % 12;
                const yearOffset1 = Math.floor((currentMonth + 1 + i) / 12);
                const yearOffset3 = Math.floor((currentMonth + 3 + i) / 12);
                const shortName = `${months[m1Idx]}${months[m2Idx]}${months[m3Idx]}`;
                const title = `${fullMonths[m1Idx]} - ${fullMonths[m3Idx]} ${currentYear + yearOffset3}`;
                const yearRange = yearOffset1 !== yearOffset3 ? `${currentYear + yearOffset1}-${currentYear + yearOffset3}` : `${currentYear + yearOffset1}`;
                outlooks.push({ id: i, shortName, title, year: yearRange, temp: extractOutlook(tResult), precip: extractOutlook(pResult) });
            }
            return outlooks;
        };

        window.getCatColor = (cat, type) => {
            if (cat === 'Above Normal') return type === 'temp' ? 'text-red-700 bg-red-50 border-red-200 dark:text-red-400 dark:bg-red-900/30 dark:border-red-800' : 'text-teal-700 bg-teal-50 border-teal-200 dark:text-teal-400 dark:bg-teal-900/30 dark:border-teal-800';
            if (cat === 'Below Normal') return type === 'temp' ? 'text-blue-700 bg-blue-50 border-blue-200 dark:text-blue-400 dark:bg-blue-900/30 dark:border-blue-800' : 'text-amber-700 bg-amber-50 border-amber-200 dark:text-amber-400 dark:bg-amber-900/30 dark:border-amber-800';
            if (cat === 'Near Normal') return 'text-emerald-700 bg-emerald-50 border-emerald-200 dark:text-emerald-400 dark:bg-emerald-900/30 dark:border-emerald-800';
            return 'text-slate-600 bg-slate-50 border-slate-200 dark:text-slate-300 dark:bg-slate-800 dark:border-slate-700'; // Equal Chances
        };

        window.setSelectedClimateMonth = (index) => {
            state.selectedClimateMonth = index;
            renderApp();
        };

        window.toggleTheme = () => {
            state.isDark = !state.isDark;
            localStorage.setItem('nws_dark', state.isDark);
            if (state.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            renderApp();
            if (state.activeTab === 'hourly' && state.forecast) setTimeout(renderHourlyChart, 0);
        };

        window.toggleUnit = () => {
            state.unit = state.unit === 'F' ? 'C' : 'F';
            localStorage.setItem('nws_unit', state.unit);
            renderApp();
            if (state.activeTab === 'hourly' && state.forecast) setTimeout(renderHourlyChart, 0);
        };

        window.loadRecentSearch = (zip) => {
            state.zipCode = zip;
            window.handleSearch();
        };

        window.fetchRadarData = async () => {
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await res.json();
                state.radarHost = data.host;
                state.radarFrames = data.radar.past; // Get past radar frames
                state.currentRadarIndex = state.radarFrames.length - 1; // Default to most recent
            } catch (err) {
                console.error("Failed to load RainViewer radar data:", err);
            }
        };

        window.updateRadarLayer = () => {
            if (!state.showMap || !window.weatherMap || state.radarFrames.length === 0) return;
            
            const frame = state.radarFrames[state.currentRadarIndex];
            const host = state.radarHost || 'https://tilecache.rainviewer.com';
            
            // Remove old layer
            if (window.radarLayer) {
                window.weatherMap.removeLayer(window.radarLayer);
            }
            
            // Add new layer (opacity set based on theme). Using maxNativeZoom to fix zoom level compatibility.
            // Color scheme 6 is NEXRAD, which matches NWS Explorer styling.
            window.radarLayer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/6/1_1.png`, {
                opacity: state.isDark ? 0.75 : 0.65,
                transparent: true,
                zIndex: 200,
                maxNativeZoom: 12, // Prevents 404s when zooming in further than the radar source allows
                maxZoom: 18        // Stretches the maxNativeZoom tiles across deeper zooms
            }).addTo(window.weatherMap);
            
            // Update UI timestamp text
            const tsEl = document.getElementById('radar-time');
            if (tsEl) {
                const d = new Date(frame.time * 1000);
                tsEl.innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        };

        window.toggleRadarPlay = () => {
            state.radarPlaying = !state.radarPlaying;
            const icon = document.getElementById('radar-play-icon');
            
            if (state.radarPlaying) {
                if (icon) icon.className = "ph-fill ph-pause text-blue-600 dark:text-blue-400";
                window.radarInterval = setInterval(() => {
                    state.currentRadarIndex = (state.currentRadarIndex + 1) % state.radarFrames.length;
                    updateRadarLayer();
                }, 1000); // 1 frame per second
            } else {
                if (icon) icon.className = "ph-fill ph-play text-blue-600 dark:text-blue-400";
                clearInterval(window.radarInterval);
            }
        };

        window.toggleMap = async () => {
            state.showMap = !state.showMap;
            
            // Stop radar if closing
            if (!state.showMap && state.radarPlaying) {
                window.toggleRadarPlay();
            }

            renderApp();

            if (state.showMap) {
                if (state.radarFrames.length === 0) {
                    await fetchRadarData();
                }

                requestAnimationFrame(() => {
                    const container = document.getElementById('map-container');
                    if (!container) return;

                    if (window.weatherMap) window.weatherMap.remove();
                    
                    // Center map on the United States
                    window.weatherMap = L.map('map-container').setView([39.8283, -98.5795], 4);
                    
                    // Use theme-appropriate tiles
                    const tileUrl = state.isDark 
                        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

                    L.tileLayer(tileUrl, {
                        attribution: '&copy; OpenStreetMap & CARTO',
                        subdomains: 'abcd',
                        maxZoom: 18
                    }).addTo(window.weatherMap);
                    
                    window.weatherMap.on('click', function(e) {
                        window.handleMapSearch(e.latlng.lat, e.latlng.lng);
                    });

                    updateRadarLayer();

                    setTimeout(() => {
                        if (window.weatherMap) window.weatherMap.invalidateSize();
                    }, 250);
                });
            }
        };

        window.handleMapSearch = async (lat, lon) => {
            state.loading = true;
            state.error = '';
            
            if (state.radarPlaying) window.toggleRadarPlay(); // Pause radar
            state.showMap = false;
            renderApp();
            
            try {
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                const data = await res.json();
                
                let placeName = "Selected Location";
                let zip = "";
                
                if (data) {
                    const city = data.city || data.locality || data.principalSubdivision || "";
                    const stateAbbr = data.principalSubdivisionCode ? data.principalSubdivisionCode.split('-').pop() : "";
                    if (city && stateAbbr) placeName = `${city}, ${stateAbbr}`;
                    
                    if (data.postcode) {
                        zip = data.postcode.split('-')[0].trim().slice(0, 5);
                        state.zipCode = zip;
                    }
                }
                
                state.locationName = placeName;
                if (zip) saveRecentSearch(zip, placeName);
                
                await window.fetchWeatherForCoords(lat, lon);
            } catch (err) {
                state.locationName = `Location (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
                await window.fetchWeatherForCoords(lat, lon);
            }
        };

        window.geolocateUser = () => {
            if (!navigator.geolocation) {
                state.error = 'Geolocation is not supported by your browser.';
                renderApp();
                return;
            }
            
            state.loading = true;
            state.error = '';
            renderApp();

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    window.handleMapSearch(lat, lon);
                }, 
                (error) => {
                    let errorMsg = 'Location access failed. Please enter your zip code manually.';
                    if (error.code === 1) errorMsg = 'Location access denied.';
                    state.error = errorMsg;
                    state.loading = false;
                    renderApp();
                },
                { timeout: 10000, maximumAge: 60000 }
            );
        };

        window.fetchWeatherForCoords = async (lat, lon) => {
            try {
                const nwsPointsUrl = `https://api.weather.gov/points/${lat},${lon}`;
                const alertsUrl = `https://api.weather.gov/alerts/active?point=${lat},${lon}`;
                
                const [pointsResponse, alertsResponse] = await Promise.all([
                    fetch(nwsPointsUrl),
                    fetch(alertsUrl).catch(() => ({ ok: false }))
                ]);
                
                if (!pointsResponse.ok) throw new Error('Weather data not available for this location via NWS.');
                const pointsData = await pointsResponse.json();

                if (alertsResponse.ok) {
                    const alertsData = await alertsResponse.json();
                    state.alerts = alertsData.features.map(f => ({
                        event: f.properties.event || 'Weather Alert',
                        severity: f.properties.severity || 'Unknown',
                        desc: f.properties.description || f.properties.instruction || 'No further details provided.',
                        headline: f.properties.headline || f.properties.event
                    }));
                }

                const forecastUrl = pointsData.properties.forecast;
                const forecastHourlyUrl = pointsData.properties.forecastHourly;

                const extent = `${lon-0.5},${lat-0.5},${lon+0.5},${lat+0.5}`;
                const cpcParams = new URLSearchParams({
                    geometry: `${lon},${lat}`,
                    geometryType: 'esriGeometryPoint',
                    sr: '4326',
                    layers: 'all',
                    tolerance: '2',
                    mapExtent: extent,
                    imageDisplay: '800,600,96',
                    returnGeometry: 'false',
                    f: 'json'
                }).toString();

                const cpcTempUrl = `https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/cpc_sea_temp_outlk/MapServer/identify?${cpcParams}`;
                const cpcPrecipUrl = `https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/cpc_sea_precip_outlk/MapServer/identify?${cpcParams}`;

                const [forecastRes, hourlyRes, cpcTempRes, cpcPrecipRes] = await Promise.all([
                    fetch(forecastUrl),
                    fetch(forecastHourlyUrl),
                    fetch(cpcTempUrl).catch(() => ({ ok: false })),
                    fetch(cpcPrecipUrl).catch(() => ({ ok: false }))
                ]);

                if (!forecastRes.ok || !hourlyRes.ok) throw new Error('Failed to retrieve forecast data.');

                const forecastData = await forecastRes.json();
                const hourlyData = await hourlyRes.json();
                
                if (cpcTempRes.ok && cpcPrecipRes.ok) {
                    try {
                        const tempData = await cpcTempRes.json();
                        const precipData = await cpcPrecipRes.json();
                        state.cpcOutlooks = window.parseCPCData(tempData, precipData);
                    } catch(e) {
                        state.cpcOutlooks = null;
                    }
                } else {
                    state.cpcOutlooks = null;
                }

                state.forecast = {
                    daily: forecastData.properties.periods,
                    hourly: hourlyData.properties.periods.slice(0, 24)
                };
                state.currentWeather = hourlyData.properties.periods[0];

            } catch (err) {
                state.error = err.message || 'An unexpected error occurred.';
            } finally {
                state.loading = false;
                renderApp();
                if (state.activeTab === 'hourly') setTimeout(renderHourlyChart, 0);
            }
        };

        window.handleSearch = async (e) => {
            if (e) e.preventDefault();
            const inputEl = document.getElementById('zip-input');
            if (inputEl) state.zipCode = inputEl.value.replace(/\D/g, '').slice(0, 5);

            if (!state.zipCode || state.zipCode.length !== 5) {
                state.error = 'Please enter a valid 5-digit US zip code.';
                renderApp();
                return;
            }

            state.loading = true;
            state.error = '';
            state.forecast = null;
            state.currentWeather = null;
            state.alerts = [];
            state.showMap = false;
            renderApp();

            try {
                const geoResponse = await fetch(`https://api.zippopotam.us/us/${state.zipCode}`);
                if (!geoResponse.ok) throw new Error('Zip code not found.');
                const geoData = await geoResponse.json();
                
                state.locationName = `${geoData.places[0]['place name']}, ${geoData.places[0]['state abbreviation']}`;
                saveRecentSearch(state.zipCode, state.locationName);

                await window.fetchWeatherForCoords(geoData.places[0].latitude, geoData.places[0].longitude);
            } catch (err) {
                state.error = err.message || 'An unexpected error occurred.';
                state.loading = false;
                renderApp();
            }
        };

        window.hourlyChartInstance = null;
        window.renderHourlyChart = () => {
            const ctx = document.getElementById('hourlyChartCanvas');
            if (!ctx || !state.forecast || !state.forecast.hourly) return;
            
            if (window.hourlyChartInstance) {
                window.hourlyChartInstance.destroy();
            }
            
            const data = state.forecast.hourly;
            const labels = data.map((d, i) => i === 0 ? 'Now' : new Date(d.startTime).toLocaleTimeString([], {hour: 'numeric'}));
            const temps = data.map(d => window.getTemp(d.temperature));
            
            // Define colors based on theme
            const textColor = state.isDark ? '#cbd5e1' : '#64748b';
            const gridColor = state.isDark ? '#334155' : '#f1f5f9';
            const lineColor = state.isDark ? '#60a5fa' : '#3b82f6'; // Tailwind blue-400 : blue-500
            
            // Create a gradient for the fill area
            const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 300);
            if (state.isDark) {
                gradient.addColorStop(0, 'rgba(96, 165, 250, 0.4)');
                gradient.addColorStop(1, 'rgba(96, 165, 250, 0.0)');
            } else {
                gradient.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
                gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');
            }

            window.hourlyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: `Temperature (°${state.unit})`,
                        data: temps,
                        borderColor: lineColor,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.4, // Smooth curve
                        pointRadius: 4,
                        pointBackgroundColor: state.isDark ? '#1e293b' : '#fff',
                        pointBorderColor: lineColor,
                        pointBorderWidth: 2,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: state.isDark ? '#1e293b' : '#fff',
                            titleColor: state.isDark ? '#f8fafc' : '#0f172a',
                            bodyColor: state.isDark ? '#cbd5e1' : '#475569',
                            borderColor: state.isDark ? '#334155' : '#e2e8f0',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: (context) => `${context.parsed.y}°${state.unit}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: textColor, font: { family: 'Inter', weight: 600 } },
                            grid: { color: gridColor, drawBorder: false },
                            suggestedMin: Math.min(...temps) - 5,
                            suggestedMax: Math.max(...temps) + 5
                        },
                        x: {
                            ticks: { color: textColor, font: { family: 'Inter' } },
                            grid: { display: false, drawBorder: false }
                        }
                    }
                }
            });
        };

        window.setMainTab = (tab) => { state.mainTab = tab; renderApp(); };
        window.setActiveTab = (tab) => { 
            state.activeTab = tab; 
            renderApp();
            if (tab === 'hourly') setTimeout(renderHourlyChart, 0); 
        };
        
        window.toggleAlertDetails = (index) => {
            const el = document.getElementById(`alert-desc-${index}`);
            const icon = document.getElementById(`alert-icon-${index}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.classList.replace('ph-caret-down', 'ph-caret-up');
            } else {
                el.classList.add('hidden');
                icon.classList.replace('ph-caret-up', 'ph-caret-down');
            }
        };

        const getWeatherIconHTML = (shortForecast, isDaytime = true) => {
            if (!shortForecast) return '';
            const forecast = shortForecast.toLowerCase();
            if (forecast.includes('rain') || forecast.includes('shower') || forecast.includes('drizzle')) return `<i class="ph-fill ph-cloud-rain text-blue-500 text-[2rem]"></i>`;
            if (forecast.includes('thunder')) return `<i class="ph-fill ph-cloud-lightning text-yellow-500 text-[2rem]"></i>`;
            if (forecast.includes('snow') || forecast.includes('ice') || forecast.includes('flurries')) return `<i class="ph-fill ph-cloud-snow text-blue-300 text-[2rem]"></i>`;
            if (forecast.includes('cloud') || forecast.includes('overcast')) return `<i class="ph-fill ph-cloud text-slate-400 dark:text-slate-500 text-[2rem]"></i>`;
            if (forecast.includes('sun') || forecast.includes('clear')) return isDaytime ? `<i class="ph-fill ph-sun text-yellow-400 text-[2rem]"></i>` : `<i class="ph-fill ph-moon text-indigo-300 text-[2rem]"></i>`;
            return isDaytime ? `<i class="ph-fill ph-sun text-yellow-400 text-[2rem]"></i>` : `<i class="ph-fill ph-moon text-indigo-300 text-[2rem]"></i>`;
        };

        const renderHeader = () => {
            let recentHTML = '';
            if (state.recentSearches.length > 0) {
                recentHTML = `
                    <div class="flex flex-wrap items-center justify-center md:justify-end gap-2 mt-3 w-full">
                        <span class="text-xs text-slate-400 dark:text-slate-500 font-medium mr-1"><i class="ph ph-clock-counter-clockwise mr-1"></i>Recent:</span>
                        ${state.recentSearches.map(s => `
                            <button onclick="loadRecentSearch('${s.zip}')" class="text-xs font-semibold px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-full transition-colors">
                                ${s.name}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            return `
            <header class="bg-white dark:bg-slate-850 rounded-2xl shadow-sm p-6 md:p-8 border border-slate-100 dark:border-slate-800 flex flex-col md:flex-row items-center justify-between gap-6 fade-in relative transition-colors duration-300">
                <div class="text-center md:text-left flex flex-col h-full justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-blue-900 dark:text-blue-100 tracking-tight flex items-center justify-center md:justify-start gap-2">
                            <i class="ph-fill ph-sun text-yellow-500 text-[1.1em]"></i>
                            NWS Explorer: CA Edition
                        </h1>
